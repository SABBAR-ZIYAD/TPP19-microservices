# Identité et port du microservice
server.port=8089
spring.application.name=SERVICE-VOITURE
spring.cloud.discovery.enabled=true

# Enregistrement auprès du serveur Eureka
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Base H2 en mémoire utilisée par le service Voiture
spring.datasource.url=jdbc:h2:mem:voiture-db
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=create-drop
